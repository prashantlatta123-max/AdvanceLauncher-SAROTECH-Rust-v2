name: Build Advance Launcher APK (Rust + Android)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
            NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-ndk

      - name: Test & Compile Rust Core (.so)
        working-directory: rust-core
        run: |
          cargo test
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../app/src/main/jniLibs build --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode Release Keystore (if configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/app/sarotech-release.jks"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          SAROTECH_KEYSTORE_PATH: ${{ github.workspace }}/app/sarotech-release.jks
          SAROTECH_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SAROTECH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SAROTECH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Build Debug APK (Fallback when Secrets not set)
        if: steps.keystore.outputs.has_keystore != 'true'
        run: gradle :app:assembleDebug

      - name: Upload Release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Advance-Launcher-SAROTECH-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        if: steps.keystore.outputs.has_keystore != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Advance-Launcher-SAROTECH-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
